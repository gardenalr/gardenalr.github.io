                sec1_text: "<p>No início dos anos 2000, movidos pelo desejo de resgatar a memória familiar, membros da família Gardenal publicaram um primeiro estudo sobre a história do sobrenome. Naquela oportunidade, adotou-se a hipótese de que <em>Gardenal</em> seria um sobrenome de origem patronímica, significando \"filho ou descendente de Gardani\" (uma derivação de nomes próprios medievais do norte italiano).</p><p>Devemos agradecer imensamente a esse esforço pioneiro, cujo entusiasmo despertou a curiosidade e criou bases para pesquisas futuras. Entretanto, a análise baseada em estudos e documentos atuais nos direciona a descartar a tese de \"filho de Gardani\". Como demonstrado posteriormente, essa associação decorria da metodologia de antigos bancos de dados heráldicos comerciais dos anos 1990 e 2000, que agrupavam sobrenomes graficamente semelhantes (como <em>Gardini</em> ou <em>Gardani</em> com <em>Gardinal</em> e <em>Gardenal</em>) em um mesmo tronco, sem que houvesse uma raiz linguística comum ou fatos históricos demonstrando a transição.</p>",

                sec1_text: "<p>All'inizio degli anni 2000, spinti dal desiderio di riscoprire la memoria familiare, alcuni membri della famiglia Gardenal pubblicarono un primo studio. In quell'occasione fu adottata l'ipotesi che <em>Gardenal</em> fosse un cognome patronimico, con il significato di \"figlio o discendente di Gardani\" (derivazione di nomi propri medievali dell'Italia settentrionale).</p><p>Va espresso un sincero ringraziamento per questo sforzo pionieristico. Tuttavia, l'analisi basata su documenti e studi attuali porta a scartare la tesi del \"figlio di Gardani\". Come dimostrato in seguito, questa associazione derivava dalle metodologie dei vecchi database araldici commerciali degli anni '90 e 2000, che raggruppavano cognomi graficamente simili (come <em>Gardini</em> o <em>Gardani</em> con <em>Gardinal</em> e <em>Gardenal</em>) senza che vi fosse una radice linguistica comune o prove storiche della transizione.</p>",

                sec3_text: "<p>L'origine dal termine <strong>Cardinale</strong> è stata dimostrata da Marino Bonifacio nel 2010. Bonifacio è un noto studioso ed etnografo (nato a Pirano nel 1941) specializzato nello studio dei dialetti e della toponomastica, autore del famoso <em>\"Dizionario dei cognomi di Trieste, dell'Istria, del Quarnero e della Dalmazia\"</em>.</p><p>Secondo le ricerche di Marino, il significato originale nacque come soprannome applicato a individui al servizio dei cardinali della Chiesa Cattolica. In alternativa, come origine toponomastica per i contadini che lavoravano nelle terre della Chiesa, o per indicare persone con atteggiamenti o abiti associabili a un Cardinale. La Chiesa fu per secoli una grande proprietaria terriera, il che giustifica la nascita di diverse linee familiari. Tutte le ipotesi riconducono a <em>Cardinale</em>, di cui <em>Gardenal</em> è un'evoluzione dialettale arcaica: <strong>Cardinale &rarr; Cardinal &rarr; Cardenal &rarr; Gardinal &rarr; Gardenàl</strong>.</p><p><strong>Evoluzione Fonetica:</strong> Nel Veneto e in Istria, la consonante iniziale <em>C</em> si è spesso sonorizzata in <em>G</em>, trasformando <em>Cardinale</em> in <em>Gardinale</em>. Infine, la caduta della vocale finale non accentata ha consolidato la forma <em>Gardenal</em> o <em>Gardinal</em>.</p>",

                sec1_text: "<p>In the early 2000s, driven by a desire to preserve family history, members of the Gardenal family published an initial study. At the time, it adopted the hypothesis that <em>Gardenal</em> was a patronymic surname meaning \"son or descendant of Gardani\" (a derivation of medieval northern Italian first names).</p><p>We are grateful for this pioneering effort. However, modern documentation leads us to discard the \"son of Gardani\" theory. This association stemmed from commercial heraldic databases of the 1990s and 2000s, which grouped visually similar surnames (such as <em>Gardini</em> or <em>Gardani</em> with <em>Gardenal</em>) without common linguistic roots or historical evidence.</p>",
                sec2_title: "2. Discarded Hypotheses: Origin from \"Garden\"",
                sec2_text: "<p>Gardini and Gardani have Germanic roots meaning \"garden\" or enclosed space. This led to superficial theories associating the surname with occupational or place names related to gardens or the gardenia flower.</p><p>This hypothesis fails when analyzing Northeastern Italian dialects. In Venetian and Istrian dialects, the word for garden is <em>xiardim</em> or <em>giardino</em>, never <em>garden</em>. The similarity to the Anglo-Saxon word <em>garden</em> is merely a false cognate with no historical foundation in the region.</p>",
                sec3_title: "3. Origin from Cardinale and Venetian Linguistic Evolution",
                sec3_text: "<p>The origin in the word <strong>Cardinale</strong> (Cardinal) was demonstrated by scholar Marino Bonifacio in 2010 in his research on Istrian and Venetian surnames.</p><p>According to Bonifacio, the surname originated as a nickname given to individuals in the service of Catholic Cardinals. Other possibilities include a locational origin for peasants living on Church lands, or a descriptive nickname for someone whose demeanor resembled a Cardinal. Because the Church was a major landowner for centuries, multiple branches emerged independently. All evidence points to <em>Cardinale</em>, with <em>Gardenal</em> being an archaic dialectal evolution: <strong>Cardinale &rarr; Cardinal &rarr; Cardenal &rarr; Gardinal &rarr; Gardenàl</strong>.</p><p><strong>Phonetic Evolution:</strong> In Venetian and Istrian dialects, the initial <em>C</em> sound voiced into <em>G</em>, changing <em>Cardinale</em> to <em>Gardinale</em>. The dropping of the unaccented final vowel (apocope) established the form <em>Gardenal</em> or <em>Gardinal</em>.</p>",
                sec4_title: "4. Historical Timeline and Documented Migration",
                sec4_items: [
                    { date: "1279", loc: "Salpi, Foggia, Apulia (Italy)", desc: "A <em>Gualterius dictus Cardinalis</em> is documented." },
                    { date: "From 1545", loc: "Trentino", desc: "Workers responsible for supplying water to cardinals during the Council of Trent were locally called <em>Gardenài</em>." },
                    { date: "1448 / 1451", loc: "Pula, Istria (Republic of Venice)", desc: "A 1451 will mentions <strong>Zane Gardenal</strong>, recorded in 1448 as <strong>Presbiter Iohannes Cardinal</strong>. In 1945, a Gardenal family still lived in Pula." },
                    { date: "1494 / 1495", loc: "Due Castelli and Rovinj, Istria", desc: "The ancestor of the Rovinj line is <strong>Antonio</strong>, son of the late <em>Antonio Gardenal</em>. Antonio is recorded in Rovinj in 1495. By 1595, families named <em>Cardinal</em> and <em>Fiorin-Cardenal</em> are recorded. This line became extinct around 1850." },
                    { date: "1580 — 1610", loc: "Rovinj & Surroundings", desc: "On January 31, 1580, <em>Zorzi Gardenal</em> married Francesca de Rocho. On November 3, 1610, <em>Bartola Gardenal</em> married, daughter of another Zorzi Gardenal."
                ],
                sec5_title: "5. Settlement in Veneto",
                sec5_text: "<p>In the 15th century, trade routes facilitated movement from Istria and Friuli toward central Veneto, or separate lines arose directly in Veneto associated with Church properties.</p><p>By the 17th and 18th centuries, the surname became established in the Treviso province (Conegliano, San Vendemiano, Mareno di Piave, Vazzola, Codognè, Oderzo). Around 1740, <strong>Pietro Gardenal</strong> was born—the earliest known ancestor of the lineage that emigrated to Tietê, São Paulo, Brazil in 1897.</p>",
                sec6_title: "6. Bibliographical References",
                refs: [
                    "<strong>BONIFACIO, Marino.</strong> <em>Origine e storia di undici casati dell'Istria</em>. Atti del Centro di Ricerche Storiche di Rovigno, Vol. XL, 2010, pp. 909–942. <a href='https://hrcak.srce.hr/clanak/351350' target='_blank' class='text-amber-800 underline'>[Link]</a>",
                    "<strong>GARDENAL, Rogerio.</strong> Parish record research in Rovinj. FamilySearch IDs <a href='https://www.familysearch.org/en/tree/pedigree/portrait/PFMB-K28' target='_blank' class='text-amber-800 underline'>PFMB-K28</a> and <a href='https://www.familysearch.org/en/tree/pedigree/portrait/PQ2W-W39' target='_blank' class='text-amber-800 underline'>PQ2W-W39</a>.",
                    "<strong>RAPELLI, Giorgio.</strong> <em>I cognomi di Verona e del Veronese: panorama etimologico-storico</em> (1995, pp. 128).",
                    "<strong>DE FRANCESCHI, Camillo.</strong> <em>Notizie storiche di Pola e delle sue famiglie</em>. Archeografo Triestino, Vol. IX, pp. 282–284. <a href='https://archive.org/details/archeografotrie09triegoog/page/n308/mode/2up' target='_blank' class='text-amber-800 underline'>[Link]</a>",
                    "<strong>COANA, Gaetano.</strong> Atti e memorie della Società Istriana di Archeologia e Storia Patria, 1886. <a href='https://play.google.com/books/reader?id=siKcDFyRs0UC&pg=GBS.PA134&hl=it' target='_blank' class='text-amber-800 underline'>[Link]</a>",
                    "<strong>BENUSSI, Bernardo.</strong> <em>Saggio di una storia dell'Istria</em>. Trieste / Centro di Ricerche Storiche di Rovigno."
                ]
            }
        };

        function setLanguage(lang) {
            if (!translations[lang]) lang = 'en';
            localStorage.setItem('preferred_lang', lang);

            // Update Text Contents
            document.getElementById('title').innerText = translations[lang].title;
            document.getElementById('subtitle').innerText = translations[lang].subtitle;
            document.getElementById('intro-content').innerHTML = translations[lang].intro;

            document.getElementById('sec1-title').innerHTML = `<i class="fa-solid fa-circle-xmark text-red-500"></i> ` + translations[lang].sec1_title;
            document.getElementById('sec1-content').innerHTML = translations[lang].sec1_text;

            document.getElementById('sec2-title').innerHTML = `<i class="fa-solid fa-seedling text-emerald-600"></i> ` + translations[lang].sec2_title;
            document.getElementById('sec2-content').innerHTML = translations[lang].sec2_text;

            document.getElementById('sec3-title').innerHTML = `<i class="fa-solid fa-church text-amber-700"></i> ` + translations[lang].sec3_title;
            document.getElementById('sec3-content').innerHTML = translations[lang].sec3_text;

            // Timeline
            document.getElementById('sec4-title').innerHTML = `<i class="fa-solid fa-timeline text-blue-600"></i> ` + translations[lang].sec4_title;
            const timelineHtml = translations[lang].sec4_items.map(item => `
                <div class="flex flex-col md:flex-row gap-2 md:gap-4 p-4 rounded-xl bg-slate-50 border border-slate-200/80">
                    <div class="md:w-1/4">
                        <span class="font-bold text-amber-800 bg-amber-100/60 px-2.5 py-1 rounded text-sm inline-block">${item.date}</span>
                        <div class="text-xs font-medium text-slate-500 mt-1">${item.loc}</div>
                    </div>
                    <div class="md:w-3/4 text-sm text-slate-700 leading-relaxed">${item.desc}</div>
                </div>
            `).join('');
            document.getElementById('sec4-content').innerHTML = timelineHtml;

            document.getElementById('sec5-title').innerHTML = `<i class="fa-solid fa-map-location-dot text-indigo-600"></i> ` + translations[lang].sec5_title;
            document.getElementById('sec5-content').innerHTML = translations[lang].sec5_text;

            document.getElementById('sec6-title').innerHTML = `<i class="fa-solid fa-book-bookmark text-slate-600"></i> ` + translations[lang].sec6_title;
            document.getElementById('references-list').innerHTML = translations[lang].refs.map(r => `<li>${r}</li>`).join('');

            // Button Styles Update
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('bg-amber-700', 'text-white', 'shadow-sm');
                btn.classList.add('text-slate-600', 'hover:bg-slate-200');
            });
            const activeBtn = document.getElementById(`btn-${lang}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-200');
                activeBtn.classList.add('bg-amber-700', 'text-white', 'shadow-sm');
            }
        }

        // Auto Detect Browser Language
        function detectLanguage() {
            const savedLang = localStorage.getItem('preferred_lang');
            if (savedLang) return savedLang;

            const userLang = (navigator.language || navigator.userLanguage).toLowerCase();
            if (userLang.startsWith('it')) return 'it';
            if (userLang.startsWith('pt')) return 'pt';
            return 'en'; // default for all other cases
        }

        // Initialize Page
        document.addEventListener('DOMContentLoaded', () => {
            const initialLang = detectLanguage();
            setLanguage(initialLang);
        });
    </script>
